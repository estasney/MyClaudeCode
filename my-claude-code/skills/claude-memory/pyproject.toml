[project]
name = "claude-memory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "estasney", email = "estasney@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "typer>=0.15",
]

[project.scripts]
claude-memory = "claude_memory.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "ERA",
    "F",
    "FA",
    "FAST",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "INP",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PLC0105",
    "PLC0131",
    "PLC0132",
    "PLC0207",
    "PLC0208",
    "PLE",
    "PLR",
    "PLW",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "TRY",
    "UP",
    "YTT",
]
ignore = [
    "A002",
    "A003",
    "ANN002",
    "ANN003",
    "ANN202",
    "ANN401",
    "ASYNC119",
    "N818",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW0603",
    "RET504",
    "RUF001",
    "RUF105",
    "RUF106",
    "RUF201",
    "TRY003",
    "UP048",
    "UP051",
]


[tool.basedpyright]
include = ["./src"]
ignore = ["tests", "**/*.pyx", "**/*.pxd"]
extraPaths = ["./src"]
pythonVersion = "3.12"
reportAny = false
reportConstantRedefinition = false
reportImplicitOverride = false
reportImplicitStringConcatenation = false
reportImportCycles = false
reportMissingModuleSource = false
reportMissingSuperCall = false
reportUnannotatedClassAttribute = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnnecessaryComparison = false
reportUnsafeMultipleInheritance = false
reportUnusedCallResult = false
reportUnusedImport = false
reportUnusedParameter = false
strictDictionaryInference = true
strictListInference = true
strictSetInference = true
